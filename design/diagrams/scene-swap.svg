<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" role="img" aria-labelledby="t d">
<title id="t">Recovered scene swap · autoload</title>
<desc id="d">Scene A and B buttons call global.goto_scene, which defers the swap, frees the current scene, loads and instances the other, adds it to root and sets it current. IDs: M-01..M-04, S-01, S-02, F-01..F-03.</desc>
<rect width="1300" height="600" fill="#faf9f5"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#25354a"/></marker>
<marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d24e42"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="32" y="44" font-size="26" font-weight="700">Recovered scene swap · autoload</text>
<text x="32" y="70" font-size="14" fill="#5b6b7c">The autoload `global` lives under root for the whole session; Scene A and Scene B are freed and rebuilt on every click.</text>
<path d="M274 212 L376 244" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="310" y="224" font-size="13" fill="#5b6b7c" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4">pressed</text>
<path d="M274 364 L377 329" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="310" y="339" font-size="13" fill="#5b6b7c" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4">pressed</text>
<path d="M612 241 L750 184" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="645" y="209" font-size="13" fill="#5b6b7c" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4">next idle frame</text>
<path d="M845 184 L845 206" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<path d="M845 294 L845 316" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<path d="M716 395 Q509 522 274 421" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="509" y="475" font-size="13" fill="#5b6b7c" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4">new current scene (A or B)</text>
<path d="M1150 294 L1150 396" fill="none" stroke="#d24e42" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#p)"/>
<text x="1220" y="336" font-size="13" fill="#d24e42" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4">holds no data today</text>
<rect x="40" y="130" width="230" height="90" rx="22" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="155" y="162" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">Scene A</text>
<text x="155" y="180" font-size="13" fill="#5b6b7c" text-anchor="middle">&quot;Go to Scene B&quot;</text>
<text x="155" y="198" font-size="13" fill="#5b6b7c" text-anchor="middle">scene_a.tscn · main scene</text>
<rect x="40" y="360" width="230" height="90" rx="22" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="155" y="392" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">Scene B</text>
<text x="155" y="410" font-size="13" fill="#5b6b7c" text-anchor="middle">&quot;Go to Scene A&quot;</text>
<text x="155" y="428" font-size="13" fill="#5b6b7c" text-anchor="middle">scene_b.tscn</text>
<rect x="380" y="245" width="250" height="80" rx="8" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="505" y="281" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">global.goto_scene(path)</text>
<text x="505" y="299" font-size="13" fill="#5b6b7c" text-anchor="middle">call_deferred · global.gd:16</text>
<rect x="720" y="110" width="250" height="70" rx="8" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="845" y="141" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">current_scene.free()</text>
<text x="845" y="159" font-size="13" fill="#5b6b7c" text-anchor="middle">global.gd:22</text>
<rect x="720" y="210" width="250" height="80" rx="8" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="845" y="237" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">ResourceLoader.load(path)</text>
<text x="845" y="255" font-size="13" fill="#5b6b7c" text-anchor="middle">instantiate() · :24-26</text>
<text x="845" y="273" font-size="13" fill="#5b6b7c" text-anchor="middle">no null check</text>
<rect x="720" y="320" width="250" height="80" rx="8" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="845" y="347" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">root.add_child(instance)</text>
<text x="845" y="365" font-size="13" fill="#5b6b7c" text-anchor="middle">current_scene = instance</text>
<text x="845" y="383" font-size="13" fill="#5b6b7c" text-anchor="middle">:29-32</text>
<rect x="1030" y="210" width="240" height="80" rx="8" fill="#fffdf7" stroke="#25354a" stroke-width="2.5"/>
<text x="1150" y="237" font-size="16" font-weight="700" fill="#25354a" text-anchor="middle">autoload `global`</text>
<text x="1150" y="255" font-size="13" fill="#5b6b7c" text-anchor="middle">persists all session</text>
<text x="1150" y="273" font-size="13" fill="#5b6b7c" text-anchor="middle">project.godot:21-23</text>
<rect x="1030" y="400" width="240" height="70" rx="8" fill="#faf9f5" stroke="#5b6b7c" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1150" y="431" font-size="16" font-weight="700" fill="#5b6b7c" text-anchor="middle">State carried across?</text>
<text x="1150" y="449" font-size="13" fill="#5b6b7c" text-anchor="middle">[MISSING] Q-05</text>
<line x1="32" y1="574" x2="72" y2="574" stroke="#25354a" stroke-width="2.5"/><text x="80" y="578" font-size="13" fill="#5b6b7c">observed in code (solid)</text>
<line x1="260" y1="574" x2="300" y2="574" stroke="#d24e42" stroke-width="2.5" stroke-dasharray="8 6"/><text x="308" y="578" font-size="13" fill="#5b6b7c">proposed / not in code (dashed)</text>
<line x1="520" y1="574" x2="560" y2="574" stroke="#5b6b7c" stroke-width="2.5" stroke-dasharray="8 6"/><text x="568" y="578" font-size="13" fill="#5b6b7c">[MISSING] intent (grey dashed)</text>
</g></svg>
